; boat-motor: ESP32-C6 (DFRobot FireBeetle 2) VESC CAN monitor + 128x64 SSD1309 OLED dashboard + u-blox GNSS speed
;
; Build / flash / monitor:   pio run -t upload && pio device monitor          (OLED, default)
; Host unit tests:           pio test -e native
; Layout demo (no hardware): pio run -e demo -t upload
; Legacy e-ink build:        pio run -e epd -t upload                        (GDEY042T81 via GxEPD2, kept but disabled)

[platformio]
default_envs = dfrobot_firebeetle2_esp32c6

; Pinned to the exact pioarduino release already installed locally (~/.platformio/platforms/espressif32/.piopm):
; Arduino core 3.3.1 on precompiled ESP-IDF 5.5.1. Do NOT use bare "espressif32" (on another machine that
; resolves to platformio/espressif32 7.x = Arduino 2.0.17 without ESP32-C6 support) and do NOT use the
; moving ".../download/stable/..." URL. Upgrade deliberately by changing this URL.
[env:dfrobot_firebeetle2_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-1/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32c6
framework = arduino

; Serial == USB-Serial/JTAG (HWCDC on GPIO12/13): the board JSON already adds
; -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1. UART0 (GPIO16/17) stays the ROM/IDF boot console.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; 4 MB flash. default.csv = 2 x 1.25 MB app (OTA) + 1.375 MB fs + coredump.
; If the image ever outgrows 1.25 MB switch to min_spiffs.csv (1.9 MB app, OTA kept) or huge_app.csv (3 MB, no OTA).
board_build.partitions = default.csv

build_flags =
    ; Arduino HAL log level: 0 none, 1 error, 2 warn, 3 info, 4 debug, 5 verbose (log_x / ESP_LOGx remapped)
    -DCORE_DEBUG_LEVEL=3
    -Wall -Wextra

; chain+ evaluates #if/#ifdef while scanning includes, so the disabled display driver's
; library is not pulled into the build.
lib_ldf_mode = chain+

; Display: DIYables_OLED_SSD1309 (I2C, Adafruit_SSD1306-compatible API) on top of Adafruit GFX -> BusIO.
; No GNSS library: hand-written UBX parser in include/ubx_min.h (covers u-blox 7 / M8 / M9 / M10).
; No CAN library: the legacy IDF driver/twai.h ships inside the precompiled Arduino libs.
lib_deps =
    diyables/DIYables_OLED_SSD1309 @ ^1.0.2
    adafruit/Adafruit GFX Library @ ^1.12.6
    adafruit/Adafruit BusIO @ ^1.17.4

; Legacy e-ink build (GDEY042T81 4.2" 400x300 via GxEPD2 on SPI). Kept for reference; not built by default.
[env:epd]
extends = env:dfrobot_firebeetle2_esp32c6
build_flags =
    ${env:dfrobot_firebeetle2_esp32c6.build_flags}
    -DDISPLAY_TYPE=DISPLAY_TYPE_EPD_GDEY042T81
lib_deps =
    ${env:dfrobot_firebeetle2_esp32c6.lib_deps}
    zinggjm/GxEPD2 @ ^1.6.9

; Layout / refresh-policy demo: synthetic changing values, no VESC or GNSS needed.
; The demo holds its values for 30 s every 2 min; dimming after 20 s makes the idle path visible.
[env:demo]
extends = env:dfrobot_firebeetle2_esp32c6
build_flags =
    ${env:dfrobot_firebeetle2_esp32c6.build_flags}
    -DDISPLAY_DEMO=1
    -DOLED_IDLE_DIM_MS=20000

; Host unit tests for the pure, Arduino-free headers (vesc_status.h, ubx_min.h, display_strings*.h).
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -DUNIT_TEST -Iinclude
build_src_filter = -<*>
