; vesc-dashboard: ESP32-C6 (DFRobot FireBeetle 2) VESC CAN monitor + 128x64 SSD1309 OLED dashboard + u-blox GNSS speed
;
; Build / flash / monitor:   pio run -t upload && pio device monitor          (OLED, default)
; Host unit tests:           pio test -e native
; Layout demo (no hardware): pio run -e demo -t upload
; Dead-man's switch:        pio run -e deadman -t upload   (opt-in: BLE beacon scan, NimBLE host via sdkconfig.defaults.ble)
; VESC over UART, no CAN:   pio run -e deadman_uart -t upload   (the deadman build with the VESC link on UART0)
; Waveshare ESP32-S3-Zero:  pio run -e s3zero_deadman_uart -t upload   (deadman_uart on the S3-Zero, README 2b)
; Over the air:             hold the button 5 s, join Wi-Fi "VESC-DASH-OTA" (passphrase on the OLED), open
;                           http://192.168.4.1 and upload .pio/build/<env>/firmware.bin (README section 7)
;
; Framework: native ESP-IDF (no Arduino core). First checkout: git submodule update --init (components/u8g2).

[platformio]
default_envs = dfrobot_firebeetle2_esp32c6

; Official PlatformIO platform, pinned: 7.1.1 = ESP-IDF 6.1.0 + GCC 15.2 toolchain (7.0.1 = ESP-IDF 6.0.1 is
; the fallback). The board definition lives in boards/ (the official platform has no FireBeetle 2 C6 entry).
; The first build downloads the toolchain, compiles ESP-IDF from source and creates ~/.platformio/penv/.espidf-*.
[env:dfrobot_firebeetle2_esp32c6]
platform = espressif32 @ 7.1.1
board = dfrobot_firebeetle2_esp32c6
framework = espidf

; Console == USB-Serial/JTAG (GPIO12/13), selected in sdkconfig.defaults (CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG).
; UART0 (GPIO16/17) stays the ROM boot console.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; 4 MB flash. partitions.csv (project root) = 2 x 1.94 MB app slots + coredump; this line is what the builder
; reads (sdkconfig.defaults points CONFIG_PARTITION_TABLE_CUSTOM_FILENAME at the same file for menuconfig).
; Changing the table needs a wired flash. A wired upload also writes an empty otadata, so it always boots app0.
board_build.partitions = partitions.csv

build_flags =
    ; Log level: CONFIG_LOG_DEFAULT_LEVEL (sdkconfig.defaults) = info. For the debug lines of this project's own
    ; tags (per-frame OLED refresh, VESC poll replies, raw CAN frames) add:  -DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG
    -Wall -Wextra

; Display: native u8g2 (components/u8g2, git submodule) over driver/i2c_master.h; the HAL is src/u8g2_hal_idf.cpp.
; No GNSS library: hand-written UBX parser in include/ubx_min.h (covers u-blox 6 / 7 / M8 / M9 / M10).
; No CAN library: ESP-IDF TWAI node driver (esp_twai_onchip.h) in src/can_vesc.cpp.

; BLE-beacon dead-man's switch (opt-in). Adds the NimBLE host (observer role only) through a second
; sdkconfig fragment; the default env has no BLE (its only radio use is update mode's Wi-Fi, README section 7).
; After editing sdkconfig.defaults.ble delete the
; generated sdkconfig.<env> of the envs below (a value already there wins over the defaults).
; The motor is cut through the VESC's OWN kill-switch input on ADC2, in parallel with the boat's
; mechanical lanyard switch - nothing is ever sent over CAN. The tag address(es) below MUST be changed
; to your hardware: a tag MAC that never matches leaves the switch in NO TAG for ever (no
; protection, said loudly on the screen and in the log).
; Read section 5 of README.md before wiring anything; the series resistor is not optional.
[env:deadman]
extends = env:dfrobot_firebeetle2_esp32c6
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.ble"
build_flags =
    ${env:dfrobot_firebeetle2_esp32c6.build_flags}
    -DDEADMAN_ENABLE=1
    -DDEADMAN_BEACON_ADDR='"F2:28:3C:03:E4:AD"'
    ; Optional second tag: with two aboard the motor is cut only when BOTH have gone quiet, so a
    ; flat battery in one of them is survivable. Which tags count is decided once, when protection
    ; begins (DEADMAN_ENROL_MS), so a tag left ashore but still in range at the dock can never join.
    ; Leave it commented out for a single-tag boat. The two addresses must differ.
    -DDEADMAN_BEACON_ADDR2='"C2:D1:E4:13:6C:70"'

; The deadman build with the VESC on its COMM-header UART instead of CAN (README section 3b).
; No transceiver: GPIO3 -> 1k -> VESC RX, GPIO2 <- 1k <- VESC TX, GND to GND. On the VESC,
; App to Use must include UART ("ADC and UART") and App Settings > UART > Baudrate must equal
; VESC_UART_BAUD (115200). Everything but the STATUS_6 values (ADC1..3, PPM) is available.
[env:deadman_uart]
extends = env:deadman
build_flags =
    ${env:deadman.build_flags}
    -DVESC_LINK_UART=1

; deadman_uart on a Waveshare ESP32-S3-Zero instead of the FireBeetle (README section 2b). Same
; GPIO numbers wherever the module has them; the OLED moves to SDA 8 / SCL 9 / RST 10, the status
; LED is the on-board WS2812 (GPIO21) and the VESC link uses UART2. sdkconfig.defaults.esp32s3
; (applied automatically for this target) runs the radio on core 0 and the firmware on core 1.
[env:s3zero_deadman_uart]
extends = env:deadman_uart
board = waveshare_esp32s3_zero
build_flags =
    ${env:deadman_uart.build_flags}
    -DBOARD_S3_ZERO=1

; Layout / refresh-policy demo: synthetic changing values, no VESC, GNSS or radio needed (the
; dead-man screens are shown with synthetic data too). The demo holds its values for 30 s every
; 2 min; dimming after 20 s makes the idle path visible.
[env:demo]
extends = env:dfrobot_firebeetle2_esp32c6
build_flags =
    ${env:dfrobot_firebeetle2_esp32c6.build_flags}
    -DDISPLAY_DEMO=1
    -DOLED_IDLE_DIM_MS=20000

; Host unit tests for the pure, framework-free headers (vesc_status.h, vesc_getvalues.h, vesc_uart.h,
; ubx_min.h, display_strings_oled.h, trip.h, deadman_logic.h, ble_addr.h).
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -DUNIT_TEST -Iinclude -DDEADMAN_ENABLE=1
build_src_filter = -<*>
